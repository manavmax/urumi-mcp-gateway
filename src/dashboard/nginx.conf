# Hardened dashboard nginx (ADR-043/ADR-046).
#
# Listens on the unprivileged 8080 (no root, no CAP_NET_BIND_SERVICE; the chart's
# Service keeps port 80 and targets the named `http` port). Every response carries
# the security headers: CSP with no inline scripts (the theme bootstrap lives in
# the external /theme-init.js), nosniff, no referrer, no framing, empty
# Permissions-Policy. NOTE nginx's add_header inheritance: a location that sets
# its own header (the /assets/ cache rule) DROPS the server-level ones, so the
# block is repeated there verbatim.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "" always;
    }
}
