# Hardened landing nginx (ADR-080), same shape as the dashboard (ADR-043/046).
#
# Listens on the unprivileged 8080 (no root, no CAP_NET_BIND_SERVICE; the
# chart runs the container as uid 101 and the Service keeps port 80). Every
# response carries the security headers: CSP with only 'self' (no inline
# scripts, the theme bootstrap lives in the external /theme-init.js), nosniff,
# no referrer, no framing, empty Permissions-Policy. NOTE nginx add_header
# inheritance: a location that sets its own header (the cache rule below)
# DROPS the server-level ones, so the block is repeated there verbatim.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The environment config must not be cached long: in-cluster the ConfigMap
    # is mounted over this path and changes must reach browsers. Exact match
    # wins over the regex below; the header block is repeated verbatim because
    # nginx drops inherited add_header inside any location that sets its own.
    location = /landing-config.js {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "" always;
    }

    # Static assets must REVALIDATE, not sit in a 7-day cache: the site has no
    # build step, so asset URLs are never content-hashed and a long max-age
    # served returning browsers a stale stylesheet against fresh HTML (the
    # band-art SVGs rendered as unstyled black shapes). nginx sends ETag and
    # Last-Modified, so no-cache costs one 304 per asset per load. Header block
    # repeated verbatim: nginx drops inherited add_header inside this location.
    location ~* \.(css|js|svg|woff2)$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "" always;
    }
}
