<!-- wp:group {"tagName":"header","area":"header","className":"urumi-site-header","layout":{"type":"constrained"}} -->
<header class="wp-block-group urumi-site-header">
	<!-- wp:group {"className":"urumi-nav","layout":{"type":"constrained"}} -->
	<div class="wp-block-group urumi-nav">
		<!-- wp:html -->
		<a class="urumi-nav__logo" href="/" aria-label="Loam & Ember home">
			<span class="urumi-nav__logo-word">Loam & Ember</span>
		</a>
		<!-- /wp:html -->

		<!-- wp:urumi-store/category-nav /-->

		<!-- wp:html -->
		<div class="urumi-nav__actions">
			<form class="urumi-nav__search" role="search" method="get" action="/">
				<label class="urumi-search-label" for="urumi-search-input">Search products</label>
				<input id="urumi-search-input" class="urumi-search-input" type="search" name="s" value="" placeholder="Search the shop" autocomplete="off" />
				<input type="hidden" name="post_type" value="product" />
				<button class="urumi-nav__search-submit" type="submit">Search</button>
			</form>
			<a class="urumi-nav__icon urumi-nav__account" href="/my-account/">Account</a>
		</div>
		<!-- /wp:html -->

		<!-- wp:woocommerce/mini-cart {"addToCartBehaviour":"open_drawer"} /-->

		<!-- wp:html -->
		<input type="checkbox" id="urumi-menu-toggle" class="urumi-menu-toggle" autocomplete="off" />
		<label class="urumi-menu-button" for="urumi-menu-toggle" aria-label="Open menu" aria-expanded="false">
			<span></span><span></span><span></span>
		</label>

		<nav class="urumi-menu-overlay" aria-label="Menu">
			<form class="urumi-menu-overlay__search" role="search" method="get" action="/">
				<label class="urumi-search-label" for="urumi-search-input-mobile">Search products</label>
				<input id="urumi-search-input-mobile" class="urumi-search-input" type="search" name="s" value="" placeholder="Search the shop" autocomplete="off" />
				<input type="hidden" name="post_type" value="product" />
				<button class="urumi-nav__search-submit" type="submit">Search</button>
			</form>
		<!-- /wp:html -->

		<!-- wp:urumi-store/category-nav {"variant":"overlay"} /-->

		<!-- wp:html -->
		</nav>
		<!-- /wp:html -->
	</div>
	<!-- /wp:group -->
</header>
<!-- /wp:group -->
