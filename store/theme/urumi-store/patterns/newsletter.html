<!-- wp:group {"align":"wide","className":"urumi-section urumi-section--newsletter","layout":{"type":"constrained"}} -->
<div class="wp-block-group alignwide urumi-section urumi-section--newsletter">
	<!-- wp:html -->
	<div class="urumi-newsletter" id="newsletter-note">
		<div class="urumi-newsletter__text">
			<h2 class="urumi-section-title">The letter</h2>
			<p class="urumi-section-sub">A short monthly note about new batches and studio seconds. Written by people, sent rarely.</p>
		</div>
		<form class="urumi-newsletter__form" method="get" action="#newsletter-note" aria-describedby="newsletter-note-text">
			<label class="urumi-search-label" for="urumi-newsletter-email">Email address</label>
			<input id="urumi-newsletter-email" type="email" name="newsletter_demo" value="" placeholder="you@example.com" autocomplete="off" />
			<button type="submit" class="urumi-btn urumi-btn--ink">Sign up</button>
		</form>
		<p class="urumi-newsletter__note" id="newsletter-note-text" role="note">This demo store does not collect email addresses. Submitting shows this note and stores nothing.</p>
	</div>
	<!-- /wp:html -->
</div>
<!-- /wp:group -->
