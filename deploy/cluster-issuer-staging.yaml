# Let's Encrypt STAGING ClusterIssuer (use first - LE has strict rate limits and
# staging certs are issued freely). Apply: kubectl apply -f cluster-issuer-staging.yaml
# Email is a PLACEHOLDER - replace with the real operator email before applying.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ops@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
