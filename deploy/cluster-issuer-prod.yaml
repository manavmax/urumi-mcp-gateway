# Let's Encrypt PRODUCTION ClusterIssuer (switch to this ONLY after staging is green).
# Apply after staging proves the HTTP-01 flow works: kubectl apply -f cluster-issuer-prod.yaml
# Email is a PLACEHOLDER - replace with the real operator email before applying.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
