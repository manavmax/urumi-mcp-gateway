<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Urumi AI: an MCP gateway on Kubernetes. One MCP endpoint for your whole team.">
  <title>Urumi AI</title>
  <desc>Wordmark and tagline for the Urumi MCP gateway on Kubernetes, dark variant.</desc>
  <rect width="1000" height="200" fill="#040804"/>
  <rect x="16" y="16" width="248" height="168" rx="12" fill="#1A1C19"/>
  <rect x="280" y="16" width="248" height="168" rx="12" fill="#0B3B36"/>
  <rect x="544" y="16" width="248" height="168" rx="12" fill="#1A1C19"/>
  <rect x="808" y="16" width="176" height="168" rx="12" fill="#0B3B36"/>
  <g fill="none" stroke="#14B8A6" stroke-width="2.5">
    <path d="M40 120 L60 92 L78 118 L96 76 L114 108 L132 60 L150 96 L168 84 L186 108 L206 120"/>
    <path d="M304 120 L324 92 L342 118 L360 76 L378 108 L396 60 L414 96 L432 84 L450 108 L470 120"/>
    <path d="M568 120 L588 92 L606 118 L624 76 L642 108 L660 60 L678 96 L696 84 L714 108 L734 120"/>
    <path d="M832 120 L852 92 L870 118 L888 76 L906 108 L924 60 L942 96 L952 84 L968 120"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="24" y="26" font-size="14" fill="#99F6E4" letter-spacing="0.5">U R U M I</text>
    <text x="290" y="26" font-size="14" fill="#99F6E4" letter-spacing="0.5">G A T E W A Y</text>
    <text x="554" y="26" font-size="14" fill="#99F6E4" letter-spacing="0.5">S E R V E R S</text>
    <text x="818" y="26" font-size="14" fill="#99F6E4" letter-spacing="0.5">M C P</text>
    <text x="24" y="150" font-size="13" fill="#8B8E89">3 upstreams, 13 tools, one /mcp endpoint</text>
    <text x="290" y="150" font-size="13" fill="#8B8E89">audit every call, per tool permissions</text>
    <text x="554" y="150" font-size="13" fill="#8B8E89">stores + hosted servers, OAuth</text>
    <text x="818" y="150" font-size="13" fill="#8B8E89">kind locally, k3s prod</text>
  </g>
  <text x="24" y="60" font-size="34" font-weight="700" fill="#E3E5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">One MCP endpoint for your whole team</text>
  <text x="24" y="86" font-size="17" fill="#A8ABA6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">WooCommerce store plus a team gateway on Kubernetes, Helm, React and FastAPI</text>
</svg>
