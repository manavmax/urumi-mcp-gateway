{{- /* Store workloads get tokenless ServiceAccounts (ADR-042): the ONLY SA in
       this chart that automounts a token is wp-setup (it writes the generated
       WooCommerce keys to the woo-secrets Secret through the K8s API), and its
       Role is rendered inside jobs/wp-setup.yaml. */}}
{{- if .Values.wordpress.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "urumi.fullname" . }}-wordpress
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
---
{{- if .Values.mariadb.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "urumi.fullname" . }}-mariadb
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
---
{{- if .Values.wooMcp.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "urumi.fullname" . }}-woo-mcp
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
