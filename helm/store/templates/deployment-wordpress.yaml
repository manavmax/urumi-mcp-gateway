{{- if .Values.wordpress.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "urumi.fullname" . }}-wordpress
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app: wordpress
    app.kubernetes.io/component: wordpress
spec:
  replicas: {{ .Values.wordpress.replicaCount }}
  selector:
    matchLabels:
      app: wordpress
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: wordpress
        app.kubernetes.io/name: {{ include "urumi.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        tier: public
    spec:
      serviceAccountName: {{ include "urumi.fullname" . }}-wordpress
      automountServiceAccountToken: false
      {{- include "urumi.imagePullSecrets" . | nindent 6 }}
      # Hardening (ADR-041/043): pod fsGroup 33 makes the wp-content PVC
      # group-writable for www-data, so the root `fix-permissions` chown
      # initContainer that used to run here is gone entirely.
      {{- include "urumi.podSecurityContext" (dict "root" $ "workload" "wordpress") | nindent 6 }}
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "urumi.fullname" . }}-mariadb {{ .Values.mariadb.port }}; do echo waiting for mariadb; sleep 2; done; echo mariadb ready"]
          securityContext:
            {{- include "urumi.securityContext" (dict "root" $ "workload" "util") | nindent 12 }}
        {{- if .Values.storeAssets.enabled }}
        - name: store-assets
          image: "{{ .Values.storeAssets.image.repository }}:{{ .Values.storeAssets.image.tag }}"
          imagePullPolicy: {{ .Values.storeAssets.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Copying store assets (theme + catalog + images) into wp-content..."
              mkdir -p /var/www/html/wp-content/themes/urumi-store /var/www/html/wp-content/store/images
              # Copy the CONTENTS (trailing /.): cp src dest NESTS when dest already
              # exists, which would leave a stale theme on the volume. The official
              # WordPress image does NOT refresh an existing wp-content volume, so
              # this copy is mandatory on every pod start.
              cp -rf /assets/themes/urumi-store/. /var/www/html/wp-content/themes/urumi-store/
              cp -f /assets/products.json /var/www/html/wp-content/store/products.json
              cp -rf /assets/images/. /var/www/html/wp-content/store/images/
              echo "store assets copied."
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
          securityContext:
            {{- include "urumi.securityContext" (dict "root" $ "workload" "storeAssets") | nindent 12 }}
        {{- end }}
      containers:
        - name: wordpress
          image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}"
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.wordpress.containerPort | default 8080 }}
              name: http
          env:
            - name: WORDPRESS_DB_HOST
              valueFrom: { secretKeyRef: { name: wordpress-secret, key: WORDPRESS_DB_HOST } }
            - name: WORDPRESS_DB_NAME
              valueFrom: { secretKeyRef: { name: wordpress-secret, key: WORDPRESS_DB_NAME } }
            - name: WORDPRESS_DB_USER
              valueFrom: { secretKeyRef: { name: wordpress-secret, key: WORDPRESS_DB_USER } }
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: wordpress-secret, key: WORDPRESS_DB_PASSWORD } }
            - name: WORDPRESS_TABLE_PREFIX
              value: wp_
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          # NOTE: kubelet follows redirects; /wp-login.php 302s to /wp-admin/install.php,
          # which takes ~6s on first PHP bootstrap. Use a static 200 endpoint for
          # readiness/liveness so probes are fast, and give startup generous headroom.
          startupProbe:
            httpGet: { path: /wp-login.php, port: http }
            periodSeconds: 5
            timeoutSeconds: 20      # cold PHP bootstrap of install redirect target
            failureThreshold: 30    # ~150s grace
          livenessProbe:
            httpGet: { path: /readme.html, port: http }
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readme.html, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
          securityContext:
            {{- include "urumi.securityContext" (dict "root" $ "workload" "wordpress") | nindent 12 }}
      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: {{ include "urumi.fullname" . }}-wp-content
{{- end }}
