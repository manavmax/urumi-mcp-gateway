{{- /* Per-store guard rails (Phase 5 brief): the ResourceQuota caps what the
       whole store namespace may take (requests, limits, storage, pod count);
       the LimitRange bounds any future workload that ships without explicit
       sizes. Sized for a laptop kind node; raise for real hardware. */}}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "urumi.fullname" . }}-quota
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ .Values.quota.requestsCpu | quote }}
    requests.memory: {{ .Values.quota.requestsMemory | quote }}
    limits.cpu: {{ .Values.quota.limitsCpu | quote }}
    limits.memory: {{ .Values.quota.limitsMemory | quote }}
    requests.ephemeral-storage: 1Gi
    persistentvolumeclaims: {{ .Values.quota.pvcTotal | quote }}
    count/pods: {{ .Values.quota.pods | quote }}
    count/deployments.apps: 4
    count/statefulsets.apps: 1
    count/services: 5
    count/jobs.batch: 2
    # secrets: chart secrets (5) + one helm release secret per revision; a
    # redrive (uninstall + reinstall) must never be blocked by the count, so
    # the cap leaves headroom for several revisions
    count/secrets: 24
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "urumi.fullname" . }}-limits
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: 500m
        memory: 512Mi
