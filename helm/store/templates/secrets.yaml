{{- /* Per-store credentials (ADR-060): a trimmed port of the main chart's
       mariadb/wordpress/admin secret generation. Same randAlphaNum-once +
       lookup-guard pattern: an upgrade never rotates a live database password,
       and helm.sh/resource-policy: keep survives teardown mishaps. NO value is
       ever committed; the provisioner never reads any of these - the WooCommerce
       keys stay in the store namespace and the gateway never sees them. */}}
{{- $rootPass := "" }}
{{- $userPass := "" }}
{{- $adminPass := "" }}
{{- if and .Values.mariadb.enabled .Values.wordpress.enabled }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "mariadb-secret" }}
{{- if $existing }}
{{- $rootPass = index ($existing.data | default dict) "MYSQL_ROOT_PASSWORD" | default "" | b64dec }}
{{- $userPass = index ($existing.data | default dict) "MYSQL_PASSWORD" | default "" | b64dec }}
{{- end }}
{{- if not $rootPass }}{{ $rootPass = randAlphaNum 24 }}{{ end }}
{{- if not $userPass }}{{ $userPass = randAlphaNum 24 }}{{ end }}
{{- end }}
{{- if and .Values.wpSetup.enabled (not .Values.wpSetup.existingAdminSecret) }}
{{- $existingAdmin := lookup "v1" "Secret" .Release.Namespace "wordpress-admin" }}
{{- if $existingAdmin }}{{ $adminPass = index ($existingAdmin.data | default dict) "password" | default "" | b64dec }}{{ end }}
{{- if not $adminPass }}{{ $adminPass = randAlphaNum 24 }}{{ end }}
{{- end }}
---
{{- if and .Values.mariadb.enabled .Values.wordpress.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    urumi.ai/credential-source: "existing Secret reused; generated once on install (randAlphaNum 24)"
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ $rootPass | quote }}
  MYSQL_DATABASE: {{ .Values.mariadb.database | quote }}
  MYSQL_USER: {{ .Values.mariadb.user | quote }}
  MYSQL_PASSWORD: {{ $userPass | quote }}
{{- end }}
---
{{- if .Values.wordpress.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-secret
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    urumi.ai/credential-source: "mirrors mariadb-secret (one shared DB password)"
type: Opaque
stringData:
  WORDPRESS_DB_HOST: {{ printf "%s-mariadb:%v" (include "urumi.fullname" .) (.Values.mariadb.port | int) | quote }}
  WORDPRESS_DB_NAME: {{ .Values.mariadb.database | quote }}
  WORDPRESS_DB_USER: {{ .Values.mariadb.user | quote }}
  WORDPRESS_DB_PASSWORD: {{ $userPass | quote }}
{{- end }}
---
{{- if and .Values.wpSetup.enabled (not .Values.wpSetup.existingAdminSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-admin
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    urumi.ai/credential-source: "existing Secret reused; generated once on install (randAlphaNum 24)"
type: Opaque
stringData:
  password: {{ $adminPass | quote }}
{{- end }}
