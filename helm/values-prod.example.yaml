# FILLED-IN shape of values-prod.yaml for a real deployment.
# Copy this to a LOCAL (uncommitted) file with your real domain, or pass --set at
# install. This example is only documentation; the committed values-prod.yaml keeps
# placeholders so a real domain is never committed (docs/DEPLOY_VPS.md).
# <owner> = your GHCR username/org: the custom images are pushed as
# ghcr.io/<owner>/<name> by `make images-push` (real image names: gateway,
# dashboard, woo-mcp, demo-mcp-time, demo-mcp-notes, store-assets, wordpress,
# wp-cli, provisioner). CPU requests are sized for the 2 vCPU node (see
# values-prod.yaml).
#
# The multi-store / hosted-servers / OAuth flags (ADR-060/062/063) are RISKY
# features that stay FALSE in every COMMITTED values file (values.yaml and
# values-prod.yaml). They are turned on ONLY in a private, uncommitted overlay
# values file - the shape below is the documentation of those keys; copy it into
# your private file and fill in <owner> and the real domains. Committed
# values-prod.yaml keeps everything off, so a flags-off install renders the
# same object list as before these features existed.
global:
  domain: shop.example.com
  ingressClass: nginx
  storageClass: local-path
  tlsEnabled: true
  # k3s NODE CIDR (the wp-setup job's API egress DNATs to the node's 6443).
  # EC2 default-VPC range shown; verify with `ip -4 addr show` on the node.
  nodeCIDR: 172.31.0.0/16

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging   # switch to letsencrypt-prod once green
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    store: store.shop.example.com
    dashboard: dashboard.shop.example.com
  tls:
    - secretName: urumi-tls
      hosts: [store.shop.example.com, dashboard.shop.example.com]

gateway:
  enabled: true
  image: { repository: ghcr.io/<owner>/gateway, tag: "1.0.0-a1b2c3d", pullPolicy: IfNotPresent }
  replicas: 1
  sessionCookieSecure: true
  # k3s pod CIDR. Safe because only ingress-nginx can reach the gateway (the
  # chart's NetworkPolicy denies every other in-cluster pod), so only the
  # controller can present a trusted X-Forwarded-For (ADR-049).
  trustedProxies: "10.42.0.0/16"
  corsAllowOrigins: "https://dashboard.shop.example.com"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 768Mi }

dashboard:
  enabled: true
  image: { repository: ghcr.io/<owner>/dashboard, tag: "1.0.0-a1b2c3d", pullPolicy: IfNotPresent }
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Landing page on the APEX host (ADR-080/083). The apex A record MUST point at
# this server before enabling. host is the bare domain; set it via --set or an
# uncommitted overlay if you do not want it in any committed file. The apex
# certificate gets its OWN secret (tlsSecret), separate from the shared
# urumi-tls Secret, because cert-manager issues one Certificate per Ingress.
landing:
  enabled: true
  image: { repository: ghcr.io/<owner>/landing, tag: "1.0.0-a1b2c3d", pullPolicy: IfNotPresent }
  host: shop.example.com
  tlsSecret: urumi-landing-tls
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }

wooMcp:
  enabled: true
  image: { repository: ghcr.io/<owner>/woo-mcp, tag: "1.0.0-a1b2c3d", pullPolicy: IfNotPresent }
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }

demoTime:
  enabled: true
  image: { repository: ghcr.io/<owner>/demo-mcp-time, tag: "1.0.0-a1b2c3d", pullPolicy: IfNotPresent }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

demoNotes:
  enabled: true
  image: { repository: ghcr.io/<owner>/demo-mcp-notes, tag: "1.0.0-a1b2c3d", pullPolicy: IfNotPresent }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

storeAssets:
  image: { repository: ghcr.io/<owner>/store-assets, tag: "1.0.0-a1b2c3d", pullPolicy: IfNotPresent }

wordpress:
  replicaCount: 1
  image: { repository: ghcr.io/<owner>/wordpress, tag: "6.6-php8.2-apache-hardened", pullPolicy: IfNotPresent }
  persistence: { size: 10Gi }
  resources:
    requests: { cpu: 150m, memory: 384Mi }
    limits: { cpu: 1000m, memory: 1Gi }

mariadb:
  storage: { size: 20Gi }
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

postgres:
  storage: { size: 10Gi }
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

wpSetup:
  enabled: true
  image: { repository: ghcr.io/<owner>/wp-cli, tag: "cli-php8.2-hardened", pullPolicy: IfNotPresent }
  resources:
    requests: { memory: 128Mi }
    limits: { cpu: 300m, memory: 512Mi }

# --- PRIVATE OVERLAY ONLY: multi-store + hosted servers + OAuth ---------------
# These keys belong in the private prod overlay (never committed). Defaults in
# the committed values stay false/empty. The VPS runs cert-manager with
# Let's Encrypt HTTP-01 ONLY: the DNS host has no API, so no DNS-01 and NO
# wildcard certificates - each store gets its own certificate per host
# (ADR-064), which is why stores.tls exists instead of one wildcard secret.
#
# Stores (ADR-060): the provisioner installs one store release per slug into
# store-<slug> namespaces. globalMax 3 / maxPerUser 1 / maxConcurrent 1 are the
# single-node VPS caps (8 GB, 2 stores fit alongside the main release; 1 at a
# time is provisioned because the wp-setup hooks are CPU-hungry).
provisioner:
  enabled: true
  image:
    repository: ghcr.io/<owner>/provisioner   # pushed by make images-push (9th image)
    tag: "1.0.0-a1b2c3d"                      # PINNED - same tag as the other images
    pullPolicy: IfNotPresent

stores:
  baseDomain: stores.shop.example.com         # wildcard DNS *.stores... -> VPS IP
  globalMax: 3                                # cluster-wide store cap
  maxPerUser: 1                               # per dashboard user
  maxConcurrent: 1                            # simultaneous helm installs (small node)
  # Per-store TLS (ADR-064): cert-manager HTTP-01, one certificate per store,
  # issuer NAME from a value (never hardcoded). Staging first, then prod.
  tls:
    enabled: true
    clusterIssuer: letsencrypt-staging        # switch to letsencrypt-prod once green

hostedServers:
  enabled: true
  # comma-separated registry prefixes the admin may host images from; anything
  # else is refused at apply time. Restrict to YOUR GHCR namespace.
  allowedRegistries: "ghcr.io/<owner>"  # no trailing slash needed (ADR-090 normalises one away, but write it bare)
  globalMax: 2
  # timeoutSeconds/resources keep their values.yaml defaults unless overridden.

oauth:
  # MCP authorization (ADR-063). MCP clients reach the gateway through the
  # dashboard host in this shape; the public base URL must match what browsers
  # use (https in prod).
  enabled: true
  publicBaseUrl: "https://dashboard.shop.example.com"
