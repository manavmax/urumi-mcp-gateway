# Production values for the Urumi chart.
#
# PLACEHOLDERS, NO REAL DOMAIN COMMITTED. The real domain is supplied at install
# time via --set or a local, uncommitted overlay file (see docs/DEPLOY_VPS.md):
#
#   helm upgrade --install urumi ./helm -n urumi --create-namespace \
#     -f helm/values-prod.yaml \
#     --set global.domain=example.com \
#     --set ingress.hosts.store=store.example.com \
#     --set ingress.hosts.dashboard=dashboard.example.com \
#     --set ingress.tls[0].hosts[0]=store.example.com \
#     --set ingress.tls[0].hosts[1]=dashboard.example.com
#
# helm/values-prod.example.yaml shows a fully filled-in shape.
global:
  domain: <domain>            # PLACEHOLDER: real domain supplied at install
  ingressClass: nginx
  storageClass: local-path    # k3s default storage class (values-driven)
  tlsEnabled: true
  # k3s NODE network CIDR (NetworkPolicy API-server egress for the wp-setup job:
  # on k3s the ClusterIP of the Kubernetes API DNATs to the node's 6443, so this
  # must contain the NODE IP). EC2 default-VPC private range is 172.31.0.0/16;
  # confirm on the box with `ip -4 addr show` and set the /16 that holds it
  # (or narrow to <node-ip>/32). k3s defaults: pods 10.42.0.0/16, services 10.43.0.0/16.
  nodeCIDR: 172.31.0.0/16

ingress:
  enabled: true
  annotations:
    # cert-manager integration: the ClusterIssuer (staging first, docs/DEPLOY_VPS.md)
    # signs the TLS Secret named below. swap to letsencrypt-prod after staging works.
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    store: store.<domain>        # PLACEHOLDER
    dashboard: dashboard.<domain>  # PLACEHOLDER
  tls:
    - secretName: urumi-tls
      hosts: [store.<domain>, dashboard.<domain>]  # PLACEHOLDER

# --- Workload images: GHCR, IfNotPresent, PINNED tags (never :latest) -------------
# After `make images-push`, pin the produced tag (e.g. 1.0.0-70d640d) here for every
# image; the PUSHED_SHA marker below is replaced by that concrete tag at deploy time.
# --- Workload images: GHCR, IfNotPresent, PINNED tags (never :latest) -------------
# After `make images-push`, pin the produced tag (e.g. 1.0.0-70d640d) here for every
# image; the PUSHED_SHA marker below is replaced by that concrete tag at deploy time.
#
# CPU REQUESTS sized for the 2 vCPU node (real finding from the first VPS deploy,
# 2026-10-20): the k3s system pods, ingress-nginx and cert-manager already hold a
# chunk of the node's allocatable cpu, and with the previous prod requests
# (gateway 250m, wordpress 300m, mariadb 300m, postgres 300m -> chart total 1400m)
# the last pods to schedule stayed Pending with "Insufficient cpu". These lowered
# REQUESTS fit that node; the LIMITS are untouched, so behaviour under load is
# unchanged (requests only affect scheduling). Budget on a 2 vCPU node:
#
# | consumer                                              | cpu requests |
# |-------------------------------------------------------|--------------|
# | 2 vCPU node, allocatable (after k3s kube-reserved)     | ~1900m       |
# | k3s system pods (coredns, metrics-server,             |              |
# |   local-path-provisioner, svclb) - stated allowance    | ~250m        |
# | ingress-nginx controller + admission webhook -         |              |
# |   stated allowance                                     | ~150m        |
# | cert-manager (controller + webhook) - stated allowance | ~150m        |
# | this chart (sum below)                                 | 700m         |
# | total                                                  | ~1250m       |
# | headroom                                               | ~650m        |
#
# (the system rows are a stated allowance, not measured values; the k3s control
# plane itself runs as host processes and carries no pod requests. Before the
# change the chart alone requested 1400m and install pods stayed Pending with
# "Insufficient cpu" on this node class.)
gateway:
  enabled: true
  image:
    repository: ghcr.io/urumi/gateway
    tag: "PUSHED_SHA"          # PINNED - set to the tag images-push produced
    pullPolicy: IfNotPresent
  replicas: 1                  # stateful pods stay at 1 (documented below)
  sessionCookieSecure: true
  # k3s pod CIDR (10.42.0.0/16), not a single controller pod IP: ingress-nginx
  # pods source from that range. Trusting it is safe because the chart's
  # NetworkPolicy makes the ingress controller the ONLY thing that can reach the
  # gateway's public port - every other in-cluster pod is denied ingress to the
  # gateway (default-deny + selector allow-list), so only ingress-nginx can
  # actually present an X-Forwarded-For for the gateway to trust. In-cluster
  # spoofing is therefore bounded to the controller itself (ADR-049).
  trustedProxies: "10.42.0.0/16"
  corsAllowOrigins: "https://dashboard.<domain>"  # PLACEHOLDER
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 768Mi }
  llm:
    enabled: true
    # Operator supplies the key via scripts/create-llm-secret.sh (hidden prompt) into
    # the chart's gateway-llm Secret; or set existingSecret to an operator Secret.
    existingSecret: ""

dashboard:
  enabled: true
  image: { repository: ghcr.io/urumi/dashboard, tag: "PUSHED_SHA", pullPolicy: IfNotPresent }
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

wooMcp:
  enabled: true
  image: { repository: ghcr.io/urumi/woo-mcp, tag: "PUSHED_SHA", pullPolicy: IfNotPresent }
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }

demoTime:
  enabled: true
  image: { repository: ghcr.io/urumi/demo-mcp-time, tag: "PUSHED_SHA", pullPolicy: IfNotPresent }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

demoNotes:
  enabled: true
  image: { repository: ghcr.io/urumi/demo-mcp-notes, tag: "PUSHED_SHA", pullPolicy: IfNotPresent }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

storeAssets:
  image: { repository: ghcr.io/urumi/store-assets, tag: "PUSHED_SHA", pullPolicy: IfNotPresent }

wordpress:
  replicaCount: 1
  image:
    repository: ghcr.io/urumi/wordpress
    tag: "6.6-php8.2-apache-hardened"   # built tag; PINNED, never :latest
    pullPolicy: IfNotPresent
  persistence:
    size: 10Gi
  resources:
    requests: { cpu: 150m, memory: 384Mi }
    limits: { cpu: 1000m, memory: 1Gi }

mariadb:
  storage: { size: 20Gi }
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

postgres:
  storage: { size: 10Gi }
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

wpSetup:
  enabled: true
  image: { repository: ghcr.io/urumi/wp-cli, tag: "cli-php8.2-hardened", pullPolicy: IfNotPresent }
  resources:
    requests: { memory: 128Mi }
    limits: { cpu: 300m, memory: 512Mi }

# --- Secrets: generated at install, never rotated on upgrade -----------------------
# Every generated Secret is rendered unconditionally but its VALUES are
# lookup-guarded (ADR-015/016): an upgrade reuses the existing Secret verbatim.
# To supply your own, pre-create the Secret with the documented keys and (where
# supported) set the existingSecret value. Nothing here holds a credential value.
