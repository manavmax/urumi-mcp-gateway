global:
  domain: 127.0.0.1.nip.io
  ingressClass: nginx
  storageClass: standard  # kind: standard, k3d/k3s: local-path
  tlsEnabled: false
  # Node network CIDR (kind: 172.18.0.0/16, k3s: 10.42.0.0/16). Needed because
  # in-cluster traffic to the API ClusterIP (kubernetes.default.svc) is DNAT-ed to a
  # node IP, so egress policies must allow this range on 443/6443.
  nodeCIDR: 172.18.0.0/16

# imagePullSecrets: a LIST, empty by default (public GHCR packages - the custom
# images hold no secrets, proven by scripts/smoke-images.sh). For private packages,
# create a docker-registry Secret once from a token fed via stdin (docs/DEPLOY_VPS.md)
# and list its name here. Never commit a token.
imagePullSecrets: []

ingress:
  enabled: true
  annotations: {}
  hosts:
    store: store.127.0.0.1.nip.io
    dashboard: dashboard.127.0.0.1.nip.io
  tls: []

# --- Pod security hardening (ADR-041) -----------------------------------------
# Rendered by the urumi.securityContext / urumi.podSecurityContext helpers in
# _helpers.tpl so every workload shares ONE hardened shape (no copy-paste drift):
# runAsNonRoot + explicit uid/gid, allowPrivilegeEscalation false, ALL capabilities
# dropped, seccompProfile RuntimeDefault. readOnlyRootFilesystem is per workload:
# true wherever the image supports it (the app containers + busybox wait probes +
# the store-assets copier); postgres needs its socket dir and wordpress/mariadb
# write runtime state, and stay false (residual documented in THREAT_MODEL.md).
# fsGroup makes PVC mounts group-writable for the non-root uid (postgres 70,
# mariadb 999, wordpress 33 - the image's own user, so no chown initContainer
# and no root anywhere).
podSecurity:
  workloads:
    gateway:     { runAsUser: 1000, runAsGroup: 1000, readOnlyRootFilesystem: true }
    dashboard:   { runAsUser: 101,  runAsGroup: 101,  readOnlyRootFilesystem: true }
    landing:     { runAsUser: 101,  runAsGroup: 101,  readOnlyRootFilesystem: true }
    wooMcp:      { runAsUser: 1000, runAsGroup: 1000, readOnlyRootFilesystem: true }
    demoTime:    { runAsUser: 1000, runAsGroup: 1000, readOnlyRootFilesystem: true }
    demoNotes:   { runAsUser: 1000, runAsGroup: 1000, readOnlyRootFilesystem: true }
    postgres:    { runAsUser: 70,   runAsGroup: 70,   readOnlyRootFilesystem: true,  fsGroup: 70 }
    mariadb:     { runAsUser: 999,  runAsGroup: 999,  readOnlyRootFilesystem: false, fsGroup: 999 }
    wordpress:   { runAsUser: 33,   runAsGroup: 33,   readOnlyRootFilesystem: false, fsGroup: 33 }
    wpSetup:     { runAsUser: 33,   runAsGroup: 33,   readOnlyRootFilesystem: false, fsGroup: 33 }
    # init containers: the store-assets copier runs as www-data (uid 33, the same
    # uid that will own the files on the PVC) and the busybox wait-for-db probes
    # run as a fixed nobody-ish uid 1000 with a read-only root.
    storeAssets: { runAsUser: 33,   runAsGroup: 33,   readOnlyRootFilesystem: true }
    util:        { runAsUser: 1000, runAsGroup: 1000, readOnlyRootFilesystem: true }
    # provisioner (Phase 5): non-root; /tmp kubeconfig + helm working dir need a
    # writable root mount, which stays an emptyDir-mounted /tmp only
    provisioner: { runAsUser: 1000, runAsGroup: 1000, readOnlyRootFilesystem: false }

# --- WordPress + WooCommerce ---
wordpress:
  enabled: true
  replicaCount: 1
  # Hardened image (ADR-043): FROM the pinned wordpress:6.6-php8.2-apache,
  # listening on the unprivileged 8080 and running as www-data (uid 33) with no
  # root process. Local Kind builds it from src/wordpress (`make wordpress-image`);
  # prod points at the registry copy. Core stays byte-identical to the upstream.
  image:
    repository: ghcr.io/urumi/wordpress
    tag: 6.6-php8.2-apache-hardened
    pullPolicy: IfNotPresent
  # containerPort is the unprivileged port the hardened image listens on; the
  # Service keeps servicePort 80 so in-cluster callers (woo-mcp WOO_URL,
  # wp-setup waits) and the Ingress stay unchanged.
  containerPort: 8080
  service:
    port: 80
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  persistence:
    enabled: true
    size: 5Gi
    # storageClassName overridden via global.storageClass

# Static storefront assets (catalog JSON, product images, block theme). The
# WordPress deployment's `store-assets` initContainer copies these into the
# wp-content volume on every pod start; the wp-setup job seeds from them by SKU.
# Repo/tag are values-driven: local Kind builds `urumi/store-assets` and imports
# it (make store-assets-image); prod points at ghcr.io/urumi/store-assets.
storeAssets:
  enabled: true
  image: { repository: ghcr.io/urumi/store-assets, tag: "0.1.0", pullPolicy: IfNotPresent }

mariadb:
  enabled: true
  image:
    repository: mariadb
    tag: "11.4"
    pullPolicy: IfNotPresent
  port: 3306
  database: wordpress
  user: wordpress
  # rootPassword/password are NOT in values: the chart generates them on install
  # (randAlphaNum 24) into the mariadb-secret Secret and reuses them afterwards.
  # Pre-create the Secret to supply your own: MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD.
  storage:
    size: 10Gi
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Postgres for gateway state (users/keys/servers/audit)
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  port: 5432
  database: urumi
  user: urumi
  # password is NOT in values: generated on install into the pg-secret Secret.
  storage:
    size: 5Gi
  persistence:
    enabled: false  # false = StatefulSet volumeClaimTemplates; true = standalone PVC (legacy)
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Placeholders — not deployed in Day 1-2 but present for helm lint
gateway:
  enabled: false
  image: { repository: ghcr.io/urumi/gateway, tag: "0.1.0", pullPolicy: IfNotPresent }
  port: 8000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # Upstream health probing (docs/11_OBSERVABILITY.md). intervalSeconds is how often
  # the background loop probes every enabled upstream; timeoutSeconds bounds one probe.
  # Default 5s / 2s: a bare `kubectl delete pod` Unreachable window is observable, and
  # recovery flips the status back within ~10s of the pod returning (the loop keeps
  # running while a server is Unreachable). These are Helm values, not code constants.
  health:
    intervalSeconds: 5
    timeoutSeconds: 2
  # Hardening (ADR-044): dashboard login lockout - after `attempts` failed logins
  # inside `windowSeconds`, per username AND per client IP, the next attempt gets
  # 429 and an audit row. In-memory, so the counter is per replica (documented).
  loginLockout:
    attempts: 5
    windowSeconds: 300
  # Hardening (ADR-044): the session cookie Secure flag. False locally (kind +
  # nip.io is plain http); values-prod sets true (TLS terminates at the Ingress,
  # browsers must never send the cookie over http).
  sessionCookieSecure: false
  # Hardening (ADR-049): trusted reverse-proxy CIDRs for the REAL client IP, fed to
  # uvicorn --forwarded-allow-ips via the gateway image CMD. Empty (default) trusts
  # NOBODY: the login throttle and audit log see the immediate peer (the ingress
  # controller pod IP). Set this to the POD CIDR in local (10.244.0.0/24) and prod
  # (k3s 10.42.0.0/16) values so ingress-nginx's appended client IP is used. A
  # spoofed X-Forwarded-For from a client is ignored: uvicorn walks the chain from
  # the right, skipping trusted proxies, so the first UNTRUSTED IP wins (the real
  # client). Proof: docs/UPGRADE_ROLLBACK.md and scripts/verify-hardening.sh.
  trustedProxies: ""
  # CORS: comma-separated allowed origins. Prod sets the https dashboard origin.
  corsAllowOrigins: ""
  # ADR-054 timezone fallback for the chat system prompt when the browser sends
  # no valid IANA timezone. Empty = code default UTC. Local demo values set
  # Asia/Kolkata; values-prod can too (unset = UTC).
  defaultTimezone: ""
  # Phase 2 (ADR-057): calls/minute limits enforced in Postgres (atomic minute
  # windows) so they hold across replicas. perKeyPerMinute is the default for
  # every API key (an admin can override ONE key from the dashboard);
  # perUserPerMinute spans every key AND the chat agent's tool calls.
  # Phase 4 (ADR-059): gateway replicas. The gateway is stateless (signed
  # cookie sessions; rate limits, login lockout and the tool cache live in
  # Postgres), so this scales horizontally. Base/prod default 1; values-local
  # runs 2 to prove multi-replica behaviour.
  replicas: 1
  rateLimit:
    perKeyPerMinute: 60
    perUserPerMinute: 240
  # Phase 3 (ADR-058): the chat agent switches to compact mode (two meta tools)
  # when the allowed tool list is longer than this. 0 disables the switch.
  compactThreshold: 40
  # Deployment progressDeadlineSeconds (default 300). With --atomic a bad upgrade
  # surfaces at the deadline (the pod never becomes Ready, the Deployment flips to
  # ProgressDeadlineExceeded and helm fails + rolls back), so a deliberate bad
  # upgrade rehearsed with `--timeout 6m` finishes in about 6 minutes instead of
  # the 10 the 600s default takes (docs/UPGRADE_ROLLBACK.md).
  progressDeadlineSeconds: 300
  # LLM wiring for the chat assistant. No API key is ever committed here (the brief
  # forbids committed secrets): the chart renders a `gateway-llm` Secret whose key
  # OPENAI_API_KEY is looked up from the cluster and left EMPTY until an operator
  # supplies a real key, so an unconfigured install says "chat is not configured"
  # instead of failing on a fake credential (docs/DECISIONS.md ADR-022).
  llm:
    enabled: true
    baseUrl: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    # Optional priority-ordered fallback chain, tried on TRANSIENT LLM errors
    # (429/500/502/503/504/timeout/connection) - e.g. Gemini's frequent 503 "high demand"
    # or 429. gateway.llm.model is always tried FIRST (back-compat); these are the
    # additional models to fail over to, in order. Set via Helm values only; no model
    # names are hardcoded in code. A model that just failed is cooled down for ~45s, and
    # the model that served a step is tried first for the next step of the same turn
    # (sticky), so a healthy model is not abandoned mid-turn.
    models: []
    # How many models may FAIL in one chat turn before it gives up. Only failures count -
    # the model that served a step never spends the budget - and the count is per turn,
    # across that turn's tool-loop iterations. Independent of the tool-call budget.
    maxModelsPerTurn: 6
    # Optional prod override: name of a pre-created Secret holding key OPENAI_API_KEY.
    # When set, the chart does NOT render its own `gateway-llm` Secret.
    existingSecret: ""

wooMcp:
  # Layer 2. For local Kind the image is built and loaded into the node
  # (`make woo-mcp-image`); for VPS/prod use the ghcr.io registry and keep this true.
  enabled: true
  image: { repository: ghcr.io/urumi/woo-mcp, tag: "0.1.0", pullPolicy: IfNotPresent }
  port: 8000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }

dashboard:
  enabled: false
  image: { repository: ghcr.io/urumi/dashboard, tag: "0.1.0", pullPolicy: IfNotPresent }
  # containerPort is the unprivileged port nginx listens on (8080, no root, no
  # CAP_NET_BIND_SERVICE needed); servicePort keeps the Service/Ingress on 80.
  port: 8080
  servicePort: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

# --- Landing page (ADR-080/083) -----------------------------------------------
# Static one-page site (src/landing) served by nginx on the APEX host. Disabled
# by default: enabling needs the apex A record pointing at this server and the
# landing.host value set (an empty host renders no Ingress on purpose). The
# nginx container runs as uid 101 on 8080 with a read-only root, same shape as
# the dashboard; ingress is allowed ONLY from the ingress controller namespace.
# No hostname is hardcoded anywhere: host + TLS secret come from these values.
landing:
  enabled: false
  image: { repository: ghcr.io/urumi/landing, tag: "0.1.0", pullPolicy: IfNotPresent }
  # The ONE place the landing page's GitHub links point at (repo root and every
  # docs/blob link are built from it at runtime). Injected into the page via the
  # landing-config ConfigMap as /landing-config.js (ADR-088); the image ships a
  # matching default so plain `docker run` also renders correct links.
  repoUrl: "https://github.com/manavmax/urumi-mcp-gateway"
  port: 8080
  servicePort: 80
  # The APEX host itself (e.g. the bare domain, not a subdomain). MUST be set
  # for the Ingress to render; the apex A record must point at the server first.
  host: ""
  # Dedicated certificate Secret for the apex host: cert-manager issues one
  # Certificate per Ingress, so the landing does NOT share the store/dashboard
  # secretName (two Certificates on one Secret would fight).
  tlsSecret: urumi-landing-tls
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }

# Extra demo upstreams (Roadmap Day 5-7 "seed 2nd/3rd servers"). They are full MCP
# servers in their own right so the gateway can prove aggregation, prefixing and
# credential injection rather than mocking them.
demoTime:
  enabled: true
  image: { repository: ghcr.io/urumi/demo-mcp-time, tag: "0.1.0", pullPolicy: IfNotPresent }
  port: 8000
  # ADR-054: default timezone when a caller omits it. Empty = code default UTC;
  # local demo values set Asia/Kolkata.
  defaultTimezone: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

demoNotes:
  enabled: true
  image: { repository: ghcr.io/urumi/demo-mcp-notes, tag: "0.1.0", pullPolicy: IfNotPresent }
  port: 8000
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }
  # The bearer token is NEVER stored in values (the brief forbids hardcoded secrets).
  # On install the chart creates the `demo-notes-token` Secret from a random token
  # (randAlphaNum) when it does not exist; because a `lookup` guards creation, the same
  # value is reused on every upgrade. Rotate by deleting the Secret and upgrading, or by
  # pre-creating it with `kubectl create secret generic demo-notes-token
  # --from-literal=NOTES_API_TOKEN=<token>` before the first install.

networkPolicy:
  enabled: true
  # Namespace that hosts the ingress controller whose pods may reach the public
  # tier (gateway, dashboard, wordpress). Selector-driven (kubernetes.io/metadata.name),
  # never a hardcoded namespace in a template.
  ingressNamespace: ingress-nginx
  # cert-manager ACME HTTP-01 solver pods (label acme.cert-manager.io/http01-solver,
  # created in this namespace while a TLS Ingress is being solved). They are covered
  # by the default-deny like every other pod, so this value is the ONLY port they
  # can be entered on: the challenge must arrive through the ingress controller.
  # The policy renders when TLS is enabled (global.tlsEnabled); see ADR-051.
  acmeSolver:
    port: 8089

wpSetup:
  enabled: true
  # Hardened wp-cli runner image (ADR-043): the upstream wordpress:cli-php8.2 with
  # /var/www/html chowned to www-data so the whole job runs as uid 33 (no root,
  # ALL caps dropped). Local Kind builds it from src/wp-cli (`make wp-cli-image`).
  image:
    repository: ghcr.io/urumi/wp-cli
    tag: cli-php8.2-hardened
    pullPolicy: IfNotPresent
  # No password value lives in any values file (the brief forbids committed secrets).
  # Admin credentials come from the `wordpress-admin` Secret, which the chart creates on
  # install with a random password (randAlphaNum 24) and then reuses forever afterwards.
  # Print it for local use with `make admin-password`.
  adminUser: admin
  # Optional prod override: name of a pre-created Secret (key `password`) that already holds
  # the admin password. When set, the chart does NOT render its own `wordpress-admin` Secret.
  existingAdminSecret: ""
  adminEmail: admin@example.com
  title: "Urumi Store"
  # WooCommerce pinned to a release compatible with the WordPress image above
  # (wp plugin install from wordpress.org; new majors need newer WP/PHP).
  wooVersion: "9.4.2"
  # Cash on delivery gateway. The setup job writes the COMPLETE gateway settings
  # (all form fields with WooCommerce defaults + these overrides) via
  # WC_Payment_Gateways, the same shape WooCommerce writes on an admin save.
  cod:
    enabled: true
    title: "Cash on delivery"
    description: "Pay with cash upon delivery."
    instructions: "Pay with cash upon delivery."
  # Seeding by SKU is idempotent: on a re-run existing products are never
  # duplicated and admin edits are never overwritten. Set seedForce to "1" to
  # force every product (name, price, copy, image, category) back to
  # store/products.json on the next run.
  seedForce: "0"
  # Hook sizing. This pod deliberately requests NO cpu, only memory: the chart's
  # other workloads plus the control plane already consume ~100% of the cpu
  # *requests* on a small local node (see helm/values-local.yaml), so any cpu
  # request here makes the pod unschedulable forever and the upgrade dies with
  # "context deadline exceeded" while it waits for the hook Job. The limit still
  # bounds the job when the node is idle. Prod can raise these.
  resources:
    requests: { memory: 128Mi }
    limits: { cpu: 300m, memory: 512Mi }

nameOverride: ""
fullnameOverride: ""

# --- Phase 5: provisioner + multi-store (ADR-060) -----------------------------
# RISKY FEATURE: default false in base AND prod; values-local flips it on.
# When false nothing provisioner-related renders, the gateway serves 403 on
# /api/stores, and the core demo path is exactly as before.
provisioner:
  enabled: false
  image: { repository: ghcr.io/urumi/provisioner, tag: "0.1.0", pullPolicy: IfNotPresent }
  port: 9000
  # helm --timeout per install attempt (waits for the wp-setup hook); must
  # stay below stores.provisionTimeoutSeconds
  helmTimeout: "540s"
  resources:
    # helm is a Go binary and each install/uninstall fork spikes ~100-200MB;
    # TWO concurrent stores provisioning (stores.maxConcurrent=2) OOM-killed a
    # 512Mi container, so the limit is generous while the request stays small
    requests: { cpu: 50m, memory: 192Mi }
    limits: { cpu: 500m, memory: 768Mi }
  # The shared internal token is generated into the provisioner-token Secret on
  # install (randAlphaNum 48) and consumed by BOTH the provisioner and the
  # gateway. NEVER a committed value.

stores:
  # <slug>.<baseDomain> per-store ingress hosts. Local uses *.localhost (browsers
  # resolve it to 127.0.0.1). Prod needs a wildcard DNS record *.<baseDomain> (or
  # per-store A records) pointing at the VPS - but NOT a wildcard CERTIFICATE:
  # the DNS host has no API, so DNS-01 (the only ACME challenge type that can
  # issue wildcards) is unavailable, and each store Ingress gets its own
  # certificate via cert-manager HTTP-01 instead (stores.tls below; ADR-064).
  baseDomain: localhost
  maxPerUser: 2
  globalMax: 12
  maxConcurrent: 2
  provisionTimeoutSeconds: 600
  # Per-store TLS via cert-manager HTTP-01 (prod). Default OFF/EMPTY everywhere:
  # the committed values never enable it; the private prod overlay turns it on.
  # When enabled, the provisioner propagates it to each store release as
  # global.tlsEnabled=true + ingress.clusterIssuer, so the store Ingress gets
  # the cert-manager cluster-issuer annotation and its own per-store TLS secret
  # (<slug>-store-tls in the store namespace). The issuer NAME comes from this
  # value - never hardcoded - so staging/prod issuers switch by values only.
  tls:
    enabled: false
    clusterIssuer: ""

oauth:
  # Phase 7 (ADR-063): MCP authorization (OAuth 2.1, minimal correct). Default
  # OFF everywhere; values-local turns it on for the scripted full-flow test.
  enabled: false
  # what the OUTSIDE world uses to reach this gateway (metadata URLs)
  publicBaseUrl: ""  # defaults to the dashboard ingress host
  resourceUri: ""    # defaults to <publicBaseUrl>/mcp
  issuer: ""         # defaults to publicBaseUrl

hostedServers:
  # Phase 6 (ADR-062): admin adds an MCP server BY CONTAINER IMAGE. RISKY: the
  # image runs in the cluster with gateway-only ingress, no SA token, read-only
  # rootfs and capped resources - but it is still an arbitrary image (see
  # THREAT_MODEL). Default OFF everywhere; values-local may turn it on.
  enabled: false
  # optional comma-separated registry prefixes; empty = any registry
  allowedRegistries: ""
  globalMax: 5
  timeoutSeconds: 300
  resources:
    # mandatory requests/limits for every hosted container (the provisioner
    # refuses an image whose pod would exceed these caps)
    cpuRequest: 30m
    memoryRequest: 64Mi
    cpuLimit: 200m
    memoryLimit: 256Mi
