{{- /* Provisioner token Secret (Phase 5, ADR-060): the shared internal secret
       consumed by BOTH the provisioner and the gateway. Generated once
       (randAlphaNum 48) and reused on upgrades - never a committed value, never
       printed. Deleting the Secret + upgrading rotates it (both consumers pick
       it up on their next start). */}}
{{- if .Values.provisioner.enabled }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "provisioner-token" }}
{{- $token := "" }}
{{- if $existing }}{{ $token = index ($existing.data | default dict) "token" | default "" | b64dec }}{{ end }}
{{- if not $token }}{{ $token = randAlphaNum 48 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: provisioner-token
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    urumi.ai/credential-source: "existing Secret reused; generated once on install (randAlphaNum 48)"
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
