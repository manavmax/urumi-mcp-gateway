{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "urumi.fullname" . }}-dashboard
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app: dashboard
spec:
  type: ClusterIP
  ports:
    # Service stays on servicePort (80); targetPort follows the named container
    # port, which the hardened image moved to the unprivileged 8080 (ADR-043).
    - port: {{ .Values.dashboard.servicePort | default 80 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
