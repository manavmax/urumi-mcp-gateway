{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "urumi.fullname" . }}-gateway
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app: gateway
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
