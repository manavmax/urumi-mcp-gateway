{{/*
  Credential Secrets.

  Rules learned the hard way (docs/DECISIONS.md ADR-016):
   1. NO credential value is committed anywhere in this repo.
   2. The Secret is ALWAYS rendered - never conditionally on `lookup`. Helm deletes
      tracked resources that disappear from a release manifest (the `resource-policy:
      keep` annotation does not prevent that), and a `lookup`-guarded Secret therefore
      vanishes on the next upgrade and is re-created from a NEW random value while the
      running pods keep the old one: databases stop accepting the password in the
      Secret, and token-protected servers start answering 401.
   3. Only the VALUES are guarded by `lookup`: if the Secret already exists, its
      values are reused verbatim (so an upgrade is a no-op and no consumer restarts);
      a missing Secret is the only case where `randAlphaNum` generates something.
   4. One value is shared wherever a credential must match (the MariaDB user password is
      read back from mariadb-secret OR wordpress-secret, and the gateway's DATABASE_URL
      is built from the same Postgres password).
   5. `lookup` returns nothing without a cluster connection, so `helm template` shows
      throwaway random values - never a real credential.

  `helm template` therefore always shows plausible-but-different secrets; the live
  values live only in the cluster.
*/}}
{{- $mariadbSecret := lookup "v1" "Secret" .Release.Namespace "mariadb-secret" }}
{{- $wpSecret := lookup "v1" "Secret" .Release.Namespace "wordpress-secret" }}
{{- $pgSecret := lookup "v1" "Secret" .Release.Namespace "pg-secret" }}
{{- $gatewaySecret := lookup "v1" "Secret" .Release.Namespace "gateway-secrets" }}
{{- $notesSecret := lookup "v1" "Secret" .Release.Namespace "demo-notes-token" }}

{{- /* reuse whatever the cluster already holds; generate only what is missing */}}
{{- $rootPass := include "urumi.secretKey" (list $mariadbSecret "MYSQL_ROOT_PASSWORD") }}
{{- $userPass := include "urumi.secretKey" (list $mariadbSecret "MYSQL_PASSWORD") }}
{{- if not $userPass }}
{{-   $userPass = include "urumi.secretKey" (list $wpSecret "WORDPRESS_DB_PASSWORD") }}
{{- end }}
{{- $pgPass := include "urumi.secretKey" (list $pgSecret "POSTGRES_PASSWORD") }}
{{- if not $pgPass }}
{{-   $pgPass = include "urumi.secretKey" (list $gatewaySecret "DATABASE_URL") | regexFind "postgresql\\+asyncpg://[^:]+:[^@]+@" | trimPrefix "postgresql+asyncpg://" }}
{{- end }}
{{- $notesToken := include "urumi.secretKey" (list $notesSecret "NOTES_API_TOKEN") }}
{{- if not $rootPass }}{{ $rootPass = randAlphaNum 24 }}{{ end }}
{{- if not $userPass }}{{ $userPass = randAlphaNum 24 }}{{ end }}
{{- if not $pgPass }}{{ $pgPass = randAlphaNum 24 }}{{ end }}
{{- if not $notesToken }}{{ $notesToken = randAlphaNum 48 }}{{ end }}
---
{{- if and .Values.mariadb.enabled .Values.wordpress.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    # keep: never delete credentials on uninstall/rollback (they may hold the only copy
    # of a database password that a volume was initialised with).
    helm.sh/resource-policy: keep
    urumi.ai/credential-source: "existing Secret reused; generated once on install (randAlphaNum 24)"
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ $rootPass | quote }}
  MYSQL_DATABASE: {{ .Values.mariadb.database | quote }}
  MYSQL_USER: {{ .Values.mariadb.user | quote }}
  MYSQL_PASSWORD: {{ $userPass | quote }}
{{- end }}
---
{{- if .Values.wordpress.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-secret
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    urumi.ai/credential-source: "mirrors mariadb-secret (one shared DB password)"
type: Opaque
stringData:
  WORDPRESS_DB_HOST: {{ printf "%s-mariadb:%v" (include "urumi.fullname" .) (.Values.mariadb.port | int) | quote }}
  WORDPRESS_DB_NAME: {{ .Values.mariadb.database | quote }}
  WORDPRESS_DB_USER: {{ .Values.mariadb.user | quote }}
  WORDPRESS_DB_PASSWORD: {{ $userPass | quote }}
{{- end }}
---
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: pg-secret
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    urumi.ai/credential-source: "existing Secret reused; generated once on install (randAlphaNum 24)"
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
{{- end }}
---
{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    urumi.ai/credential-source: "existing Secret reused; generated once on install"
type: Opaque
stringData:
  # Fernet key used to encrypt upstream credentials at rest (32 url-safe base64 bytes;
  # randAlphaNum 44 is a valid subset). Always regenerated-but-reused like the rest.
  FERNET_KEY: {{ include "urumi.secretKey" (list $gatewaySecret "FERNET_KEY") | default (randAlphaNum 44) | quote }}
  # Same generated Postgres password as pg-secret above, so the gateway can connect.
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s-postgres:%v/%s" .Values.postgres.user $pgPass (include "urumi.fullname" .) (.Values.postgres.port | int) .Values.postgres.database | quote }}
  # Empty until an operator supplies a real key (Days 8-9).
  OPENAI_API_KEY: {{ include "urumi.secretKey" (list $gatewaySecret "OPENAI_API_KEY") | quote }}
{{- end }}
---
{{- if .Values.demoNotes.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: demo-notes-token
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    urumi.ai/token-source: "existing Secret reused; generated once on install (randAlphaNum 48)"
type: Opaque
stringData:
  # Bearer token the demo Notes MCP requires on every /mcp request.
  # Rotate: `kubectl create secret ... --from-literal=NOTES_API_TOKEN=<new>` + restart
  # the deployment (rotation here is explicit and never happens on upgrade).
  NOTES_API_TOKEN: {{ $notesToken | quote }}
{{- end }}
