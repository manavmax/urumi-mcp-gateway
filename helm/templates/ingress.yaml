{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "urumi.fullname" . }}
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.global.ingressClass }}
  {{- if .Values.global.tlsEnabled }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName | quote }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.store | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "urumi.fullname" . }}-wordpress
                port:
                  number: {{ .Values.wordpress.service.port | default 80 }}
  {{- if .Values.dashboard.enabled }}
    - host: {{ .Values.ingress.hosts.dashboard | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "urumi.fullname" . }}-gateway
                port:
                  number: {{ .Values.gateway.port | default 8000 }}
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ include "urumi.fullname" . }}-gateway
                port:
                  number: {{ .Values.gateway.port | default 8000 }}
          {{- if .Values.oauth.enabled }}
          # Phase 7 (ADR-063): OAuth discovery + endpoints go to the GATEWAY
          # (the dashboard's nginx 404s /.well-known/* by design)
          - path: /.well-known/oauth-protected-resource
            pathType: Exact
            backend:
              service:
                name: {{ include "urumi.fullname" . }}-gateway
                port:
                  number: {{ .Values.gateway.port | default 8000 }}
          - path: /.well-known/oauth-authorization-server
            pathType: Exact
            backend:
              service:
                name: {{ include "urumi.fullname" . }}-gateway
                port:
                  number: {{ .Values.gateway.port | default 8000 }}
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: {{ include "urumi.fullname" . }}-gateway
                port:
                  number: {{ .Values.gateway.port | default 8000 }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "urumi.fullname" . }}-dashboard
                port:
                  number: {{ .Values.dashboard.servicePort | default 80 }}
  {{- else }}
    # Before dashboard ships, dashboard host proxies to wordpress for demo parity
    - host: {{ .Values.ingress.hosts.dashboard | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "urumi.fullname" . }}-wordpress
                port:
                  number: {{ .Values.wordpress.service.port | default 80 }}
  {{- end }}
{{- end }}
