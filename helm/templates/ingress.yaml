{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "urumi.fullname" . }}
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.global.ingressClass }}
  {{- if .Values.global.tlsEnabled }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName | quote }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.store | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "urumi.fullname" . }}-wordpress
                port:
                  number: 80
  {{- if .Values.dashboard.enabled }}
    - host: {{ .Values.ingress.hosts.dashboard | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "urumi.fullname" . }}-gateway
                port:
                  number: 8000
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ include "urumi.fullname" . }}-gateway
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "urumi.fullname" . }}-dashboard
                port:
                  number: 80
  {{- else }}
    # Before dashboard ships, dashboard host proxies to wordpress for demo parity
    - host: {{ .Values.ingress.hosts.dashboard | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "urumi.fullname" . }}-wordpress
                port:
                  number: 80
  {{- end }}
{{- end }}
