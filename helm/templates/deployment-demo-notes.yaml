{{- if .Values.demoNotes.enabled }}
{{- /* A secretKeyRef is resolved by the kubelet at container start, so editing the
       demo-notes-token Secret does NOT restart the pod: the server would keep serving
       the old bearer token while the gateway re-syncs to the new one, and every
       notes__ call would 401. This checksum changes only when the token's contents
       change, so a rotation is what forces the restart - same mechanism as the
       woo-mcp checksum (and the gateway's own notes-token-checksum). */}}
{{- $notesSecret := lookup "v1" "Secret" .Release.Namespace "demo-notes-token" }}
{{- $notesChecksum := "" }}
{{- if $notesSecret }}{{- $notesChecksum = index ($notesSecret.data | default dict) "NOTES_API_TOKEN" | default "" | sha256sum }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "urumi.fullname" . }}-demo-notes
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app: demo-notes
    app.kubernetes.io/component: demo-notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-notes
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        # Changes only when the demo-notes-token contents change -> forces a rollout so
        # the pod always authenticates with the token that is actually in the Secret.
        urumi.io/notes-secret-checksum: {{ $notesChecksum }}
      labels:
        app: demo-notes
        app.kubernetes.io/name: {{ include "urumi.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        tier: private
    spec:
      serviceAccountName: {{ include "urumi.fullname" . }}-demo-notes
      automountServiceAccountToken: false
      {{- include "urumi.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: demo-notes
          image: "{{ .Values.demoNotes.image.repository }}:{{ .Values.demoNotes.image.tag }}"
          imagePullPolicy: {{ .Values.demoNotes.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.demoNotes.port }}
              name: http
          env:
            # Bearer token injected from the Secret (never from values at runtime).
            - name: NOTES_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: demo-notes-token
                  key: NOTES_API_TOKEN
          resources:
            {{- toYaml .Values.demoNotes.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            # /readyz verifies the token is actually configured (503 otherwise).
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            {{- include "urumi.securityContext" (dict "root" $ "workload" "demoNotes") | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
