{{- if .Values.provisioner.enabled }}
{{- /* Least-privilege RBAC (ADR-060). A ClusterRole CANNOT filter namespaces
       by label, so the mitigation is twofold: (1) the verbs below are exactly
       what creating/reading/deleting store namespaces + their helm releases
       need and nothing more; (2) the provisioner CODE asserts the
       urumi.io/managed-by=provisioner label before touching any existing
       namespace and only ever installs releases into namespaces it created
       (provisioner/k8s.py require_managed). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "urumi.fullname" . }}-provisioner
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app: provisioner
# the ONE component that talks to the K8s API deliberately (it is its job)
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "urumi.fullname" . }}-provisioner
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app: provisioner
rules:
  # namespaces: create labeled store namespaces, read/patch (labels)/delete them
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # the store chart's workload kinds (read for status derivation + helm's waiter)
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "secrets", "persistentvolumeclaims", "serviceaccounts", "pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  # helm CREATES/UPDATES/DELETES the store chart's resources inside store-<slug>
  # namespaces it just created; the code-level label guard keeps the target set
  # to those namespaces only
  - apiGroups: ["", "apps", "batch", "networking.k8s.io", "rbac.authorization.k8s.io"]
    resources: ["deployments", "statefulsets", "services", "secrets", "persistentvolumeclaims", "serviceaccounts", "jobs", "ingresses", "networkpolicies", "resourcequotas", "limitranges", "roles", "rolebindings"]
    verbs: ["create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "urumi.fullname" . }}-provisioner
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app: provisioner
subjects:
  - kind: ServiceAccount
    name: {{ include "urumi.fullname" . }}-provisioner
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "urumi.fullname" . }}-provisioner
  apiGroup: rbac.authorization.k8s.io
{{- end }}
