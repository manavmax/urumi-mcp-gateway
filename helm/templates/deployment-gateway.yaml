{{- if .Values.gateway.enabled }}
{{- /* The gateway reads FERNET_KEY, SESSION_SECRET and DATABASE_URL from the
        gateway-secrets Secret, the LLM key from gateway-llm (or an operator Secret named
        by gateway.llm.existingSecret), and the demo-notes bearer token from
        demo-notes-token. A secretKeyRef is resolved by the kubelet when the container
        starts, so editing a Secret does NOT restart the pod: a rotated Fernet key would
        leave the gateway unable to decrypt stored upstream credentials, a rotated LLM key
        would keep using the old one, and a rotated notes token would make every notes__
        call 401, until some unrelated rollout happened to replace the pod. These checksums
        change only when the Secret's contents change, so the rotation is what forces the
        restart - same mechanism as the woo-mcp checksum. */}}
{{- $gwSecret := lookup "v1" "Secret" .Release.Namespace "gateway-secrets" }}
{{- $gwChecksum := "" }}
{{- if $gwSecret }}{{- $gwChecksum = ($gwSecret.data | default dict | toYaml | sha256sum) }}{{- end }}
{{- $notesSecret := lookup "v1" "Secret" .Release.Namespace "demo-notes-token" }}
{{- $notesChecksum := "" }}
{{- if $notesSecret }}{{- $notesChecksum = (index ($notesSecret.data | default dict) "NOTES_API_TOKEN" | default "" | sha256sum) }}{{- end }}
{{- /* declared OUTSIDE the if so the annotation below can always reference it */}}
{{- $llmChecksum := "" }}
{{- if .Values.gateway.llm.enabled }}
{{- $llmSecret := lookup "v1" "Secret" .Release.Namespace (.Values.gateway.llm.existingSecret | default "gateway-llm") }}
{{- if $llmSecret }}{{- $llmChecksum = ($llmSecret.data | default dict | toYaml | sha256sum) }}{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "urumi.fullname" . }}-gateway
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app: gateway
    app.kubernetes.io/component: gateway
spec:
  strategy:
    type: Recreate
  # Fails the rollout (and with --atomic triggers the rollback) when no progress for
  # this long; value default 300 so a rehearsed bad upgrade + rollback lands in ~6m.
  progressDeadlineSeconds: {{ .Values.gateway.progressDeadlineSeconds | default 300 }}
  # Phase 4 (ADR-059): the gateway is stateless (signed cookie sessions, Postgres
  # rate limits/lockout, DB-backed tool cache), so it scales horizontally.
  # values-local runs 2 replicas to prove it; values-prod stays at 1 unless
  # Manav raises it.
  replicas: {{ .Values.gateway.replicas | default 1 }}
  selector:
    matchLabels:
      app: gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        # Changes only when the gateway-secrets contents change -> forces a rollout so the
        # pod always starts with the credentials that are actually in the Secret.
        urumi.io/gateway-secret-checksum: {{ $gwChecksum }}
        # Same for the notes bearer token, which the gateway injects on every notes__ call.
        urumi.io/notes-token-checksum: {{ $notesChecksum }}
        # Same for the LLM key, which the chat assistant picks up only at client creation.
        urumi.io/llm-secret-checksum: {{ $llmChecksum }}
      labels:
        app: gateway
        app.kubernetes.io/name: {{ include "urumi.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        tier: public
    spec:
      serviceAccountName: {{ include "urumi.fullname" . }}-gateway
      automountServiceAccountToken: false
      {{- include "urumi.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.gateway.port }}
              name: http
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: gateway-secrets, key: DATABASE_URL, optional: true } }
            - name: FERNET_KEY
              valueFrom: { secretKeyRef: { name: gateway-secrets, key: FERNET_KEY, optional: true } }
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: gateway-secrets, key: SESSION_SECRET, optional: true } }
            - name: NOTES_API_TOKEN
              valueFrom: { secretKeyRef: { name: demo-notes-token, key: NOTES_API_TOKEN, optional: true } }
{{- if .Values.gateway.llm.enabled }}
            # LLM key: from the chart's own `gateway-llm` Secret, or from an operator Secret
            # named by gateway.llm.existingSecret (required, like GATEWAY_ADMIN_PASSWORD, so a
            # typo in existingSecret stops the pod instead of silently disabling chat).
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.llm.existingSecret | default "gateway-llm" }}
                  key: OPENAI_API_KEY
            # endpoint/model are NOT secrets: they come from values, so changing them is a
            # normal, reviewable edit rather than a Secret patch.
            - name: OPENAI_BASE_URL
              value: {{ .Values.gateway.llm.baseUrl | quote }}
            - name: OPENAI_MODEL
              value: {{ .Values.gateway.llm.model | quote }}
            # Comma-separated priority-ordered fallback chain, first entry = model.
            - name: OPENAI_MODELS
              value: {{ concat (list .Values.gateway.llm.model) (.Values.gateway.llm.models | default list) | uniq | join "," | quote }}
            # How many models may FAIL per chat turn before it gives up. Only failures
            # count (the serving model never spends the budget), so a turn whose top
            # models are busy still completes on a healthy one. A Helm value, not code.
            - name: OPENAI_MAX_MODELS_PER_TURN
              value: {{ .Values.gateway.llm.maxModelsPerTurn | default 6 | quote }}
{{- end }}
            # Gateway administrator bootstrap. Always present because the chart always
            # renders the Secret (ADR-019); the gateway refuses to invent a password, so a
            # missing key means "no admin bootstrap" instead of a committed default.
            - name: GATEWAY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: gateway-admin, key: password } }
            # Upstream health probing cadence (docs/11_OBSERVABILITY.md): the loop runs
            # every intervalSeconds and each probe has a timeoutSeconds budget. Defaults
            # 5s/2s; a bare `kubectl delete pod` Unreachable window becomes observable and
            # recovery flips the status within ~10s. Helm values, not code constants.
            - name: HEALTH_INTERVAL_SECONDS
              value: {{ .Values.gateway.health.intervalSeconds | default 5 | quote }}
            - name: HEALTH_TIMEOUT_SECONDS
              value: {{ .Values.gateway.health.timeoutSeconds | default 2 | quote }}
            # F3: chat image upload byte cap (default 5 MB, validated by magic bytes
            # and re-encoded with Pillow before anything is stored).
            - name: IMAGE_UPLOAD_MAX_BYTES
              value: {{ .Values.gateway.imageUploadMaxBytes | default 5242880 | quote }}
            # Hardening (ADR-044): login lockout policy (attempts per window, per
            # username AND per client IP; in-memory counter, so per replica).
            - name: LOGIN_LOCKOUT_ATTEMPTS
              value: {{ .Values.gateway.loginLockout.attempts | default 5 | quote }}
            - name: LOGIN_LOCKOUT_WINDOW_SECONDS
              value: {{ .Values.gateway.loginLockout.windowSeconds | default 300 | quote }}
            # Hardening (ADR-044): session cookie Secure flag (values-prod sets true).
            - name: SESSION_COOKIE_SECURE
              value: {{ .Values.gateway.sessionCookieSecure | default false | quote }}
            # Hardening (ADR-049): trusted reverse-proxy CIDRs for the REAL client IP.
            # Fed to uvicorn --forwarded-allow-ips via the image CMD; empty (default)
            # trusts nobody, so the login throttle and audit log see the immediate peer
            # (the ingress controller pod IP) and a spoofed X-Forwarded-For is ignored.
            - name: FORWARDED_ALLOW_IPS
              value: {{ .Values.gateway.trustedProxies | default "" | quote }}
            # Visible build/version stamp: served by the gateway root endpoint and the
            # FastAPI version. Comes from Chart.yaml appVersion, so a chart bump is a
            # visible, verifiable change (docs/UPGRADE_ROLLBACK.md).
            - name: SERVICE_VERSION
              value: {{ .Chart.AppVersion | quote }}
            # CORS: comma-separated allowed origins for dashboard cross-origin calls
            # (values-prod sets the https dashboard origin).
            - name: CORS_ALLOW_ORIGINS
              value: {{ .Values.gateway.corsAllowOrigins | default "" | quote }}
            # Phase 2 (ADR-057): per-key and per-user calls/minute, enforced via
            # Postgres minute-window counters (work across replicas).
            - name: RATE_LIMIT_PER_MINUTE
              value: {{ .Values.gateway.rateLimit.perKeyPerMinute | default 60 | quote }}
            - name: RATE_LIMIT_USER_PER_MINUTE
              value: {{ .Values.gateway.rateLimit.perUserPerMinute | default 240 | quote }}
            # Phase 3 (ADR-058): chat agent auto-switches to compact mode above
            # this many allowed tools (0 = never).
            - name: COMPACT_THRESHOLD
              value: {{ .Values.gateway.compactThreshold | default 40 | quote }}
            {{- if .Values.provisioner.enabled }}
            # Phase 5 (ADR-060): the gateway calls the provisioner with this shared
            # token (Secret provisioner-token) and projects store status to the
            # Stores page. All of it inert when provisioner.enabled is false.
            - name: STORES_ENABLED
              value: "true"
            - name: PROVISIONER_URL
              value: "http://{{ include "urumi.fullname" . }}-provisioner:{{ .Values.provisioner.port }}"
            - name: PROVISIONER_TOKEN
              valueFrom: { secretKeyRef: { name: provisioner-token, key: token } }
            - name: STORES_BASE_DOMAIN
              value: {{ .Values.stores.baseDomain | quote }}
            - name: STORES_MAX_PER_USER
              value: {{ .Values.stores.maxPerUser | default 2 | quote }}
            - name: STORES_GLOBAL_MAX
              value: {{ .Values.stores.globalMax | default 12 | quote }}
            {{- end }}
            # Timezone fallback (ADR-054): the chat system prompt stamps this zone when
            # the browser sends no valid IANA timezone. Base default is UTC; the local
            # demo values set Asia/Kolkata.
            - name: GATEWAY_DEFAULT_TIMEZONE
              value: {{ .Values.gateway.defaultTimezone | default "UTC" | quote }}
            # Prometheus /metrics guard (ADR-056). The value is an OPTIONAL in-cluster
            # scrape token: when set, GET /metrics demands it. It must never be a
            # committed value - put it in the gateway-secrets Secret (key
            # METRICS_BEARER) if you want one; empty leaves the endpoint
            # unauthenticated but still in-cluster-only.
            - name: METRICS_BEARER
              valueFrom: { secretKeyRef: { name: gateway-secrets, key: METRICS_BEARER, optional: true } }
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            {{- include "urumi.securityContext" (dict "root" $ "workload" "gateway") | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # Phase 4 (ADR-059): SOFT anti-affinity - prefer spreading gateway
      # replicas across nodes; a single-node cluster (kind) simply ignores it.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: gateway
                    app.kubernetes.io/instance: {{ .Release.Name }}
                topologyKey: kubernetes.io/hostname
{{- end }}
