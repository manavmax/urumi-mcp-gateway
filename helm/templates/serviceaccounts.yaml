{{/* Hardening (ADR-042): one dedicated ServiceAccount per workload, and none of
        them automounts a token (automountServiceAccountToken: false on the SA and
        on every pod spec). The ONLY token in the namespace belongs to the wp-setup
        hook SA (jobs/wp-setup.yaml): that job PROVES an API need - it writes the
        generated Woo CK/CS into the woo-secrets Secret through the K8s API under a
        Role scoped to exactly secrets:get/create/patch/update in this namespace.
        Every other workload was verified by grep to contain no K8s API client and
        runs green with no token (scripts/verify-hardening.sh checks the mount is
        absent). */}}
{{- if .Values.gateway.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "urumi.fullname" . }}-gateway
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app: gateway
automountServiceAccountToken: false
{{- end }}
