{{- if .Values.landing.enabled }}
{{- /* Landing ServiceAccount (ADR-042 family): one dedicated SA, and the pod
        automounts NO token. Kept in its own landing-*.yaml file (instead of the
        shared serviceaccounts.yaml) so this component's templates stay
        conflict-free against other branches. The landing container serves
        static files and touches no API, so it needs no token (same verified
        posture as the dashboard). */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "urumi.fullname" . }}-landing
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app: landing
automountServiceAccountToken: false
{{- end }}
