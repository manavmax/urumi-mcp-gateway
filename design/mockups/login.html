<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Urumi Gateway: Sign in (SAMPLE mockup)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ring:rgba(185,196,221,.55);
    --bg:#ECEBE7; --surface:#FFFFFF; --surface-2:#F4F3EF;
    --hairline:rgba(20,23,28,.07);
    --text:#14171C; --text-muted:#5F6673;
    --ink:#14171C; --ink-hover:#2A2E35;
    --butter:#F3E6C4; --blush:#F4DCD8; --lilac:#E4DEF1; --sky:#DCE7F3; --sand:#EADFCB;
    --periwinkle:#B9C4DD; --peach:#EFCBBE;
    --grad-A:linear-gradient(135deg,#B9C4DD 0%,#D9C8DC 52%,#EFCBBE 100%);
    --bad-bg:#F4DCD8; --bad-text:#8A3B33;
    --r-card:24px; --r-inner:14px; --r-pill:999px;
    --shadow-card:0 1px 2px rgba(20,23,28,.04), 0 10px 30px rgba(20,23,28,.05);
    --shadow-pop:0 2px 4px rgba(20,23,28,.05), 0 16px 40px rgba(20,23,28,.10);
    --ring:rgba(185,196,221,.55);
    --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --t-xs:11px; --t-sm:12px; --t-md:13px; --t-base:14px; --t-lg:16px; --t-xl:20px;
    --dur-fast:150ms; --dur-mid:300ms; --dur-slow:700ms;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:var(--t-base);line-height:1.45;min-height:100vh}
  .ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .ic.sm{width:14px;height:14px}
  .muted{color:var(--text-muted)}
  .small{font-size:var(--t-sm)}

  /* full-page soft gradient glow background (gradient use c: login art) */
  .glow-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
    radial-gradient(720px 560px at 78% 12%, rgba(185,196,221,.55), transparent 70%),
    radial-gradient(640px 520px at 12% 88%, rgba(239,203,190,.42), transparent 70%),
    radial-gradient(560px 420px at 45% 40%, rgba(217,200,220,.28), transparent 70%),
    var(--bg)}
  .drift-a{animation:drift-a 36s var(--ease) infinite}
  .drift-b{animation:drift-b 28s var(--ease) infinite}
  .drift-c{animation:drift-c 44s var(--ease) infinite}
  @keyframes drift-a{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(14px,-18px) rotate(4deg)}}
  @keyframes drift-b{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,12px)}}
  @keyframes drift-c{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(10px,10px) scale(1.03)}}
  .shape{position:fixed;border-radius:50%;pointer-events:none;z-index:-1}
  .shape.arch{border-radius:44% 44% 8% 8% / 60% 60% 6% 6%}

  .stage{min-height:100vh;display:grid;place-items:center;padding:32px 16px}
  .login-card{width:100%;max-width:440px;background:var(--surface);border-radius:24px;box-shadow:var(--shadow-card),0 24px 64px rgba(20,23,28,.08);padding:40px;display:grid;gap:16px;animation:fade-up var(--dur-slow) var(--ease) both}
  @keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .logo-row{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .mark-40{width:40px;height:40px;color:var(--text);flex:none}
  .wordmark{font-size:var(--t-xl);font-weight:650;letter-spacing:-.02em;line-height:1}
  .wordmark .sub{font-size:var(--t-sm);font-weight:500;color:var(--text-muted);letter-spacing:0;margin-left:8px}
  h1{font-size:var(--t-xl);letter-spacing:-.02em;margin-top:8px}
  .helper{color:var(--text-muted);font-size:var(--t-sm)}
  .field{display:grid;gap:6px}
  .field label{font-size:var(--t-sm);font-weight:650}
  .field input{font:inherit;color:var(--text);background:var(--surface);box-shadow:inset 0 0 0 1px var(--hairline);border:none;border-radius:var(--r-pill);padding:11px 16px;width:100%;transition:box-shadow var(--dur-fast) var(--ease)}
  .field input::placeholder{color:var(--text-muted)}
  .field input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--ink),0 0 0 3px var(--ring)}
  .ring{--ring:rgba(185,196,221,.55)}
  .btn{font:inherit;font-weight:650;cursor:pointer;border-radius:var(--r-pill);padding:12px 18px;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;transition:background var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease)}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--ink);color:#fff;justify-content:center;width:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
  .btn-primary:hover{background:var(--ink-hover)}
  .alert{display:none;align-items:center;gap:8px;background:var(--bad-bg);color:var(--bad-text);border-radius:var(--r-inner);padding:10px 14px;font-size:var(--t-sm);font-weight:600}
  .alert.on{display:flex}
  .foot{font-size:var(--t-xs);color:var(--text-muted);text-align:center;margin-top:4px}
  .tagline{position:fixed;left:48px;bottom:48px;max-width:30ch;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
  .tagline .small{display:block;margin-top:8px;font-size:var(--t-sm);font-weight:400;color:var(--text-muted);max-width:42ch}
  @media (max-width:960px){ .tagline{display:none} .login-card{padding:28px} }

  @keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-delay:0 !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;transition-delay:0ms !important}}
  body.rm *,body.rm *::before,body.rm *::after{animation-duration:.01ms !important;animation-delay:0 !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;transition-delay:0ms !important}
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-logo" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M9.2 16.8v-3.4a2.8 2.8 0 0 1 5.6 0v3.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M7 12h10" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5L21 19.5H3L12 4.5z"/><path d="M12 10v4.5M12 17h.01"/></symbol>
</svg>

<!-- drifting pastel shapes behind the glow -->
<div class="shape arch" style="top:8%;right:6%;width:220px;height:200px;background:var(--grad-A);opacity:.35;animation:drift-a 36s var(--ease) infinite"></div>
<div class="shape" style="top:58%;left:4%;width:300px;height:300px;border-radius:50%;background:var(--lilac);opacity:.45;animation:drift-b 28s var(--ease) infinite"></div>
<div class="shape" style="top:12%;left:18%;width:120px;height:120px;border-radius:50%;background:var(--peach);opacity:.4;animation:drift-c 44s var(--ease) infinite"></div>

<div class="tagline" aria-hidden="true">One gateway for every tool your team uses.</div>

<section class="stage">
  <form class="login-card" aria-label="Sign in" onsubmit="event.preventDefault()">
    <div class="row" style="gap:12px">
      <svg width="40" height="40" viewBox="0 0 24 24" style="color:var(--text)"><use href="#i-logo"/></svg>
      <div style="font-size:var(--t-xl);font-weight:650;letter-spacing:-.02em">Urumi<span class="sub" style="font-size:var(--t-sm);font-weight:500;color:var(--text-muted)">Gateway</span></div>
    </div>
    <h1 style="font-size:var(--t-xl);letter-spacing:-.02em;margin-top:8px">Sign in</h1>
    <p class="helper" style="color:var(--text-muted);font-size:var(--t-sm)">Use your workspace account to reach the gateway console.</p>

    <div class="alert" role="alert" id="err">
      <svg class="ic sm"><use href="#i-alert"/></svg>
      <span>Invalid email or password.</span>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="admin@urumi.local" value="admin@urumi.local">
    </div>
    <div class="field">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="************">
    </div>

    <button class="btn btn-primary" type="submit">Sign in<svg class="ic sm"><use href="#i-check"/></svg></button>

    <p class="foot">Access is managed by your administrator</p>
  </form>
</section>

<script>
  (function(){
    if (new URLSearchParams(location.search).get("error") === "1") {
      document.getElementById("err").classList.add("on");
    }
  })();
</script>

</body>
</html>
